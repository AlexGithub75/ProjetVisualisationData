<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Attack Analysis Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analyse des Cyberattaques</h1>
        <p class="subtitle">Visualisation et analyse des données de sécurité informatique</p>
    </header>
    
    <div class="container">
        <!-- Filtres et contrôles -->
        <div class="controls">
            <select id="timeRangeFilter">
                <option value="all">Toutes les périodes</option>
                <option value="day">Dernier jour</option>
                <option value="week">Dernière semaine</option>
                <option value="month">Dernier mois</option>
            </select>
            
            <select id="attackTypeFilter">
                <option value="all">Tous les types d'attaque</option>
                <!-- Options dynamiques -->
            </select>
            
            <select id="severityFilter">
                <option value="all">Toutes les sévérités</option>
                <option value="High">Haute</option>
                <option value="Medium">Moyenne</option>
                <option value="Low">Basse</option>
            </select>
            
            <button id="applyFilters">Appliquer les filtres</button>
            <button id="resetFilters" class="btn-reset">Réinitialiser</button>
            <button id="exportData" class="btn-export">
                <i class="fas fa-download"></i> Exporter
            </button>
        </div>
        
        <!-- Indicateurs de performance clés (KPIs) -->
        <div class="dashboard-grid">
            <div class="card" id="totalAttacks">
                <div class="card-header">
                    <h3 class="card-title">Total des attaques</h3>
                </div>
                <div class="card-body">
                    <div class="kpi-value">-</div>
                </div>
            </div>
            
            <div class="card" id="attackDistribution">
                <div class="card-header">
                    <h3 class="card-title">Répartition des attaques</h3>
                </div>
                <div class="card-body">
                    <div class="kpi-chart"></div>
                </div>
            </div>
            
            <div class="card" id="severityDistribution">
                <div class="card-header">
                    <h3 class="card-title">Répartition des sévérités</h3>
                </div>
                <div class="card-body">
                    <div class="kpi-chart"></div>
                </div>
            </div>
            
            <div class="card" id="blockedAttacks">
                <div class="card-header">
                    <h3 class="card-title">Attaques bloquées</h3>
                </div>
                <div class="card-body">
                    <div class="kpi-value">-</div>
                    <div class="kpi-percent">-</div>
                </div>
            </div>
        </div>
        
        <!-- Menu de navigation -->
        <div id="menu"></div>
        
        <!-- Visualisation principale -->
        <div id="visualization">
            <div id="chartControls" class="chart-controls"></div>
            <svg width="100%" height="600"></svg>
            <div id="chartLegend" class="chart-legend"></div>
        </div>
        
        <!-- Timeline des attaques (nouveau graphique) -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Timeline des attaques</h3>
            </div>
            <div class="card-body">
                <div id="timelineChart">
                    <svg width="100%" height="300"></svg>
                </div>
            </div>
        </div>
        
        <!-- Carte géographique (nouveau graphique) -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Distribution géographique</h3>
            </div>
            <div class="card-body">
                <div id="geoMapChart">
                    <svg width="100%" height="400"></svg>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tooltip pour les interactions -->
    <div id="tooltip" class="tooltip" style="opacity: 0;"></div>
    
    <!-- Bouton de basculement thème clair/sombre -->
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>
    
    <!-- Loader pour le chargement de données -->
    <div id="loader" class="loader" style="display: none;">
        <div class="loader-spinner"></div>
    </div>
    
    <!-- Chargement des scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-geo.v2.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
